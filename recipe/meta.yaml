{% set name = "hdf5storage" %}
{% set version = "0.2.2" %}
{% set sha256 = "6cfd031aeba0fdfb9fb1db2aa75b09a8d6b845c98745b4a2c0c8d8d752d58fe7" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  fn: {{ name }}-{{ version }}.zip
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  # only build on linux-64 because of noarch
  noarch: python
  skip: True  # [not linux64] 

  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    - pip
    - python >=2.6
    - setuptools
    - poetry-core

  run:
    - python >=2.6
    - h5py >=3.3
    - numpy
    - scipy

test:
  requires:
    - pip
  imports:
    - hdf5storage
  commands:
    - pip check

about:
  home: https://github.com/frejanordsiek/hdf5storage
  license: BSD-2-Clause
  license_family: BSD
  license_file: COPYING.txt
  summary: Utilities to read/write Python types to/from HDF5 files, including MATLAB v7.3 MAT files.
  description: Utilities to read/write Python types to/from HDF5 files, including MATLAB v7.3 MAT files.
  doc_url: https://pythonhosted.org/hdf5storage
  dev_url: https://github.com/frejanordsiek/hdf5storage

extra:
  recipe-maintainers:
    - jakirkham
  skip-lints:
    - avoid_noarch    
    - missing_source_tracking # ProServe build
    - missing_hash  # only during initial build
    - reachable_url # false positive

  anaconda-services:
    recipe-maintainers:
       - bkreider
    comment: "https://anaconda.zendesk.com/agent/tickets/120666"
    
